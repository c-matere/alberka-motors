# Reverse-proxy snippet used by every Payload-backed location on alberka.co.ke.
# Installed at /etc/nginx/snippets/alberka-cms-proxy.conf by scripts/deploy_site.py
proxy_pass http://127.0.0.1:3005;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $alberka_connection_upgrade;
proxy_connect_timeout 10s;
proxy_read_timeout 300s;
proxy_buffering off;
add_header Cache-Control "no-store, max-age=0" always;
