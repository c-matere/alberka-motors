# alberka.co.ke / alberkamotors.co.ke
# Static Vite SPA + reverse proxy to the Payload CMS on 127.0.0.1:3005.
# Managed by scripts/deploy_site.py — edit deploy/nginx/alberka-motors.conf instead.

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    client_max_body_size 100M;
    root /home/ec2-user/alberka-motors/dist;
    index index.html;

    location /api { include /etc/nginx/snippets/alberka-cms-proxy.conf; }
    location /admin { include /etc/nginx/snippets/alberka-cms-proxy.conf; }
    location /_next/ { include /etc/nginx/snippets/alberka-cms-proxy.conf; }
    location /media/ { include /etc/nginx/snippets/alberka-cms-proxy.conf; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name alberka.co.ke www.alberka.co.ke alberkamotors.co.ke www.alberkamotors.co.ke;

    client_max_body_size 100M;
    root /home/ec2-user/alberka-motors/dist;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api { include /etc/nginx/snippets/alberka-cms-proxy.conf; }
    location /admin { include /etc/nginx/snippets/alberka-cms-proxy.conf; }
    location /_next/ { include /etc/nginx/snippets/alberka-cms-proxy.conf; }
    location /media/ { include /etc/nginx/snippets/alberka-cms-proxy.conf; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name alberka.co.ke www.alberka.co.ke alberkamotors.co.ke www.alberkamotors.co.ke;

    ssl_certificate /etc/letsencrypt/live/alberka.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alberka.co.ke/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;
    root /home/ec2-user/alberka-motors/dist;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api { include /etc/nginx/snippets/alberka-cms-proxy.conf; }
    location /admin { include /etc/nginx/snippets/alberka-cms-proxy.conf; }
    location /_next/ { include /etc/nginx/snippets/alberka-cms-proxy.conf; }
    location /media/ { include /etc/nginx/snippets/alberka-cms-proxy.conf; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
